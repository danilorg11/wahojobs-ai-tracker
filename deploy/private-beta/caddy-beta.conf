[Service]
EnvironmentFile=/etc/wahojobs-beta/config-001/caddy.env
# Packaged Caddy units commonly use --environ, which would log the proxy secret.
ExecStart=
ExecStart=/usr/bin/caddy run --config /etc/caddy/Caddyfile
ExecReload=
ExecReload=/usr/bin/caddy reload --config /etc/caddy/Caddyfile --force

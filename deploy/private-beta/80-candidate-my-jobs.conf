# Optional release activation only. Install after a verified backup and review.
# Existing runtime/catalog credentials and private-beta configuration are retained.
# Stage routes with enabled=true/public_controls=false; advertise only after the
# final-origin real Production journey. Disable with both fields false; retain DB.
[Service]
LoadCredential=candidate-v1.json:/etc/wahojobs-beta/candidate-v1.json
ExecStartPre=/usr/bin/install -m 0600 %d/candidate-v1.json /run/wahojobs-beta/candidate-v1.json
ExecStart=
ExecStart=/opt/wahojobs-beta/current/.venv/bin/python -B scripts/private_beta_app.py --config /run/wahojobs-beta/runtime.json --logs /var/log/wahojobs-beta --public-catalog-config /run/wahojobs-beta/public-catalog-v1.json --candidate-config /run/wahojobs-beta/candidate-v1.json

# Install only after the public catalog release has been approved.
# The separate protected configuration must exist before starting the app.
# Systemd reads the root-only source and copies it into the beta-owned runtime
# directory. The service never needs traversal access to /etc/wahojobs-beta.
[Service]
LoadCredential=public-catalog-v1.json:/etc/wahojobs-beta/public-catalog-v1.json
ExecStartPre=/usr/bin/install -m 0600 %d/public-catalog-v1.json /run/wahojobs-beta/public-catalog-v1.json
ExecStart=
ExecStart=/opt/wahojobs-beta/current/.venv/bin/python -B scripts/private_beta_app.py --config /run/wahojobs-beta/runtime.json --logs /var/log/wahojobs-beta --public-catalog-config /run/wahojobs-beta/public-catalog-v1.json

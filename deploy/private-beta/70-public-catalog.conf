# Install only after the public catalog release has been approved.
# The separate protected configuration must exist before starting the app.
# Preserve the existing runtime.json LoadCredential selection and beta origin.
[Service]
ExecStart=
ExecStart=/opt/wahojobs-beta/current/.venv/bin/python -B scripts/private_beta_app.py --config %d/runtime.json --logs /var/log/wahojobs-beta --public-catalog-config /etc/wahojobs-beta/public-catalog-v1.json
